# 发布地址。App 检查更新和下载都走 DOWNLOAD_URL。
# 留空 DOWNLOAD_URL 则编译出的 App 不带「检查更新」。
DOWNLOAD_URL="https://dl.launchusapp.com"

# publish.sh 把更新包 rsync 到这里。DEPLOY_HOST 是 ~/.ssh/config 里的别名，IP 不进仓库。
DEPLOY_HOST="launchus-web"
DEPLOY_DIR="/srv/launchus"
#   $DEPLOY_DIR/dl     下载站（dl.launchusapp.com）：
#     appcast.xml                          最新版本的更新源，App 读这个
#     LaunchUS.dmg                         最新版本的安装包
#     v<版本>/LaunchUS-<版本>.zip          最新版本的更新包，appcast 里的下载地址指向这里
#     appcast-intel.xml                    Intel 版的更新源，Intel 版 App 读这个
#     LaunchUS-Intel.dmg                   Intel 版的安装包
#     v<版本>/LaunchUS-<版本>-Intel.zip    Intel 版的更新包
#     v<版本>/LaunchUS-<版本>.dmg          Beta 的安装包（publish.sh --beta），正式版的只在上面
#   appcast 第一项是正式版，Beta 在它后面，带 <sparkle:channel>beta</sparkle:channel>
#   只放正式版、上一个正式版（回滚用）和 Beta，publish.sh 每次发布后删掉更旧的

# publish.sh 同时发一份 GitHub Release，GitHub 保留所有版本，App 更新不依赖它。留空则不发。
GITHUB_REPO="baka9981/LaunchUS"
